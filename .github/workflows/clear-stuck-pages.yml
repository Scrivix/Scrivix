name: Clear stuck Pages publication
on:
  push:
    branches: [main]
    paths: [".github/workflows/clear-stuck-pages.yml"]
permissions:
  pages: write
jobs:
  clear-stuck-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel timed-out Pages deployment
        env:
          GH_REPAIR_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, json
          endpoint = "https://api.github.com/repos/Scrivix/Scrivix/pages/deployments/64f505b98700f77a7fe4b6fe29682db306b98c81"
          headers = {"Authorization": "Bearer " + os.environ["GH_REPAIR_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          request = urllib.request.Request(endpoint + "/cancel", headers=headers, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("Cancellation request status:", response.status)
          except urllib.error.HTTPError as error:
              print("Cancellation request status:", error.code)
              if error.code != 404:
                  raise SystemExit(1)
          request = urllib.request.Request(endpoint, headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("Pages status:", json.load(response).get("status", "unknown"))
          except urllib.error.HTTPError as error:
              print("Status request:", error.code)
              if error.code != 404:
                  raise SystemExit(1)
          PY

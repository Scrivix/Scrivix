<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MATHO · Teacher remote</title>
<link rel="stylesheet" href="../style.css?v=shared-1"><link rel="stylesheet" href="../live.css?v=remote-countdown-1">
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']]},options:{enableMenu:false},startup:{typeset:false}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script defer src="../https-peer.js?v=https-2"></script><script defer src="../room-service.js?v=https-1"></script>
<script defer src="live-core.js?v=round-review-1"></script><script defer src="remote.js?v=countdown-1"></script>
</head><body><div class="live-shell"><header class="live-header"><a class="brand" href="../"><span style="color:var(--M)">M</span><span style="color:var(--A)">A</span><span style="color:var(--T)">T</span><span style="color:var(--H)">H</span><span style="color:var(--O)">O</span><small>PRIVATE TEACHER REMOTE</small></a><span id="remoteStatus" class="live-status" role="status">Connecting to your laptop…</span></header>
<main class="live-main"><p id="remoteNotice" class="remote-notice" role="status">Keep your laptop awake with the teacher page open.</p>
<div id="remoteMain" hidden><section class="live-card"><div class="eyebrow" id="remoteRoom"></div><h1 id="remoteHeading">Your classroom, in hand.</h1><div class="remote-top-actions"><button id="remoteNext" class="live-primary">Next expression →</button><button id="remoteLock">Lock joining</button><button id="remoteNew">New Round ↻</button><button id="remoteEnd" style="background:var(--green);color:var(--paper)">End Room</button></div>
<div id="remoteCurrent" class="remote-current"></div><p id="remoteAnswer" class="live-note"></p><div id="remotePattern"></div>
<section class="remote-auto" aria-label="Automatic draw timer"><div><label class="live-label" for="remoteSeconds">Auto draw · seconds between expressions</label><div class="live-actions"><input id="remoteSeconds" class="live-input" type="number" min="5" max="600" value="30" style="max-width:110px"><button id="remoteAuto">Start auto draw</button></div></div><div id="remoteTimerBox" class="remote-countdown"><span>NEXT EXPRESSION IN</span><strong id="remoteTimer" role="timer" aria-label="Time until next expression">0:30</strong><small id="remoteTimerState">Auto draw is off</small></div></section>
<p id="remoteWinners"></p><button id="remoteReview" hidden>Reveal round review</button></section>
<section class="live-card"><h2 id="remoteCount">Students</h2><p id="remoteClaims" class="remote-claim-count"></p><div id="remoteRoster"></div></section></div>
<dialog id="remoteInspect"><div class="dialog-top"><h2 id="remoteInspectName"></h2><button id="remoteCloseInspect">Close</button></div><p>Shaded squares are this student’s marks. Review colors appear only after you reveal the round review.</p><div id="remoteInspectBoard" class="room-board mini-board remote-board"></div></dialog>
</main></div></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATHO · Join a game</title><link rel="stylesheet" href="../style.css?v=shared-1"><link rel="stylesheet" href="../live.css?v=shared-1"><script defer src="../library-client.js?v=1"></script><script defer src="join.js?v=short-codes-1"></script></head>
<body class="student-page"><div class="live-shell"><header class="live-header"><a class="brand" href="../" aria-label="MATHO home"><span style="color:var(--M)">M</span><span style="color:var(--A)">A</span><span style="color:var(--T)">T</span><span style="color:var(--H)">H</span><span style="color:var(--O)">O</span><small>YOUR BOARD. YOUR THINKING.</small></a></header><main class="live-main"><section class="live-card join-card"><div class="eyebrow">STUDENT JOIN</div><h1>Join the fun.</h1><p>Enter your teacher’s room code and your name.</p><form id="entryForm"><label class="live-label" for="code">Room code</label><input class="live-input" id="code" required maxlength="8" pattern="[A-Za-z2-9]{5}([A-Za-z2-9]{3})?" placeholder="5-character code" autocomplete="off" autocapitalize="characters"><label class="live-label" for="name">First name or nickname</label><input class="live-input" id="name" required maxlength="32" autocomplete="off" placeholder="Your name"><div id="olderRoom" hidden><label class="live-label" for="edition">Which game is your class playing?</label><select class="live-input" id="edition"><option value="">Choose a game</option></select><p class="live-note">Older rooms need this one extra choice.</p></div><div class="live-actions"><button class="live-primary" id="entryButton" type="submit">Join game →</button></div></form><p id="entryError" role="alert"></p><p class="live-note">No account needed. Your teacher will give you the room code.</p></section></main></div></body></html>
